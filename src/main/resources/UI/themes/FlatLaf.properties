# Application wide style, applied on top of every FlatLaf theme
# (registered in MainWindow with FlatLaf.registerCustomDefaultsSource)

@accentColor = #2F6FED

Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 6
ProgressBar.arc = 6
Component.focusWidth = 1
Component.innerFocusWidth = 0

TitlePane.unifiedBackground = true
TitlePane.menuBarEmbedded = true
TitlePane.showIcon = true

MenuItem.selectionArc = 6
MenuItem.selectionInsets = 0,4,0,4
MenuBar.selectionArc = 6
MenuBar.selectionInsets = 2,2,2,2
PopupMenu.borderCornerRadius = 8

ScrollBar.showButtons = false
ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.trackArc = 999

SplitPane.dividerSize = 6
SplitPaneDivider.style = plain

Tree.rowHeight = 26
Tree.selectionArc = 8
Tree.selectionInsets = 0,4,0,4
Tree.leftChildIndent = 8
Tree.rightChildIndent = 12

Table.rowHeight = 28
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 0,1
Table.cellMargins = 2,10,2,10
Table.selectionArc = 0
TableHeader.height = 32
TableHeader.cellMargins = 2,10,2,10
TableHeader.showTrailingVerticalLine = false

List.selectionArc = 8
List.selectionInsets = 0,4,0,4
List.cellMargins = 4,8,4,8

TabbedPane.tabHeight = 34

ToolBar.spacingBorder = 2,4,2,4
ToolBar.borderMargins = 4,8,4,8
